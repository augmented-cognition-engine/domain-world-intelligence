[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-domain-world-intelligence"
version = "0.8.0"
description = "Inert ACE World Intelligence Domain Pack and conformance fixtures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["ace-core>=0.3.0,<0.4"]

[dependency-groups]
dev = [
  "ace-ext-world-federal-register-source",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.12",
]

[tool.uv.sources]
ace-ext-world-federal-register-source = { path = "adapters/federal_register_source", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["domain_packs*"]
exclude = ["domain_packs.tests*"]
namespaces = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"domain_packs.world_intelligence" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]
"domain_packs.world_intelligence_federal_register" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]

[tool.pytest.ini_options]
testpaths = ["domain_packs/tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
