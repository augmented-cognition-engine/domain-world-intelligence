[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-domain-world-intelligence"
version = "0.12.0"
description = "Inert ACE World Intelligence Domain Pack and conformance fixtures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["ace-core>=0.8.2,<0.9"]

[project.urls]
Homepage = "https://github.com/augmented-cognition-engine/domain-world-intelligence"
Repository = "https://github.com/augmented-cognition-engine/domain-world-intelligence"
Issues = "https://github.com/augmented-cognition-engine/domain-world-intelligence/issues"
Changelog = "https://github.com/augmented-cognition-engine/domain-world-intelligence/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/augmented-cognition-engine/domain-world-intelligence/blob/main/ROADMAP.md"

[dependency-groups]
dev = [
  "ace-app-world-ai-builder",
  "ace-ext-world-federal-register-source",
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.12",
  "setuptools>=69",
]

[tool.uv.sources]
ace-app-world-ai-builder = { path = "adapters/world_ai_builder", editable = true }
ace-ext-world-federal-register-source = { path = "adapters/federal_register_source", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["domain_packs*"]
exclude = ["domain_packs.tests*"]
namespaces = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"domain_packs.world_intelligence" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]
"domain_packs.world_intelligence_federal_register" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]
"domain_packs.world_intelligence_federal_register_monitor" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]
"domain_packs.world_intelligence_ai" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]
"domain_packs.world_intelligence_planetary_defense" = [
  "*.json",
  "modules/*.json",
  "conformance/*.json",
]

[tool.pytest.ini_options]
testpaths = ["domain_packs/tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
