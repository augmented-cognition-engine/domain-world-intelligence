[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-ext-world-federal-register-source"
version = "0.3.0"
description = "Read-only official-source adapters for ACE World Intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["ace-core>=0.6.0,<0.7"]

[project.urls]
Repository = "https://github.com/augmented-cognition-engine/domain-world-intelligence"
Issues = "https://github.com/augmented-cognition-engine/domain-world-intelligence/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ace_world_federal_register_source*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
